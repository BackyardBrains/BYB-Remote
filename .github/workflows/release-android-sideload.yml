name: Release - Android test APK (sideload)

# Builds a release APK signed with the stable upload key, for testers to install directly
# (Settings > install unknown apps). Test builds are always OK to run: no approval needed.
# Output: a run artifact, plus (by default) a GitHub pre-release "test-<versionCode>".

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Also publish a GitHub pre-release with the APK attached."
        type: boolean
        required: true
        default: true
      notes:
        description: "For testers (plain English): what changed and what to try."
        type: string
        required: false
        default: ""

concurrency:
  group: release-android-sideload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sideload:
    name: android-sideload
    runs-on: ubuntu-latest
    # Signing secrets live in this environment, which only main can use.
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Require main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "::error::Release builds come from main only; received $WORKFLOW_REF"
            exit 1
          fi

      - name: Checkout (full history for the version code)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper checksum
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          code="$(bash tool/version_code.sh)"
          name="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "BYB Remote $name ($code)"

      - name: Decode Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret ${name} is not set. See docs/RELEASING.md > One-time setup."
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/byb-remote-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "ANDROID_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          ./gradlew --stacktrace assembleRelease -PversionCode="$VERSION_CODE"
          asset="BYB-Remote-${VERSION_NAME}-${VERSION_CODE}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "$asset" | tee signer.txt
          {
            echo "### BYB Remote test APK"
            echo
            echo "- Version: \`$VERSION_NAME ($VERSION_CODE)\`"
            echo "- File: \`$asset\`"
            echo "- SHA-256: \`$(sha256sum "$asset" | cut -d' ' -f1)\`"
            echo "- Signer: \`$(grep -m1 'SHA-256 digest' signer.txt | sed 's/.*: //')\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as run artifact
        uses: actions/upload-artifact@v7
        with:
          name: byb-remote-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: ${{ env.ASSET }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub pre-release
        if: inputs.publish_prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          tag="test-${VERSION_CODE}"
          body="Test build for testers. Install: open this page on the Android phone, download the APK, and allow installing it when asked."
          if [ -n "$NOTES" ]; then
            body="$(printf '%s\n\n%s' "$NOTES" "$body")"
          fi
          gh release create "$tag" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "BYB Remote test build ${VERSION_NAME} (${VERSION_CODE})" \
            --notes "$body"

      - name: Clean up Android upload key
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            shred -u "$ANDROID_KEYSTORE_PATH" 2>/dev/null || rm -f "$ANDROID_KEYSTORE_PATH"
          fi
